<!doctype html>
<html lang="es">

    <a href="#/notas" data-vista="notas" class="nav">Notas</a>

<div id="aviso" class="aviso" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
<script src="/notas.js"></script>
<script src="/recorrido.js"></script>
